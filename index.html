<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rosey Sci Bowl Reader 🎀</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="brand">
    <div class="brand-title">ROSEY SCI BOWL READER</div>

    <div class="brand-subtitle">
      ♡ no more losing practice time, have me read instead! ♡
    </div>
  </div>

  <select id="packet">
    <option>Loading packets...</option>
  </select>

  <select id="subject">
    <option value="all">All Subjects</option>
  </select>

  <select id="speed">
    <option value="0.75">0.75×</option>
    <option value="1" selected>1×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
    <option value="2">2×</option>
  </select>

  <select id="voice">
    <option>Loading voices...</option>
  </select>

</header>


<main>

  <div class="decorations">
    ♡　✦　୨୧　✦　♡
  </div>

  <div id="info">
    Loading...
  </div>

  <div id="timer"></div>

  <div id="question">
    Loading...
  </div>

  <div id="answer"></div>

  <div class="controls">

    <button id="mainButton">
      🔊 READ QUESTION
    </button>

    <button id="replay">
      ↻ REPLAY
    </button>

  </div>

</main>


<footer class="site-footer">

  <button id="contactButton" class="contact-link">
    Contact
  </button>

  <div class="profile-circle">
    <img src="/rosepfp.png" alt="Rose">
  </div>

</footer>


<!-- CONTACT POPUP -->

<div id="contactModal" class="contact-modal">

  <div class="contact-box">

    <button id="closeContact" class="close-contact">
      ×
    </button>

    <div class="contact-title">
      Contact
    </div>


    <div class="contact-item">

      <span>
        Discord: @argi9
      </span>

      <button id="copyDiscord" class="copy-button">
        copy
      </button>

    </div>


    <div class="contact-item">

      <span>
        Email: tinosciencebowl@gmail.com
      </span>

      <button id="copyEmail" class="copy-button">
        copy
      </button>

    </div>


    <div class="contact-heart">
      ♡
    </div>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="app.js"></script>

</body>
</html>
